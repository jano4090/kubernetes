---
- name: Initialize Kubernetes cluster
  command: >
    kubeadm init 
    --pod-network-cidr=10.244.0.0/16 
    --service-cidr=10.96.0.0/12
    --cri-socket=unix:///var/run/crio/crio.sock
  register: init_output
  changed_when: "'Your Kubernetes control-plane has been initialized' in init_output.stdout"

- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    mode: 0755

- name: Copy kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    mode: 0644

- name: Set KUBECONFIG environment variable
  lineinfile:
    path: /root/.bashrc
    line: 'export KUBECONFIG=/root/.kube/config'

- name: Install Flannel pod network
  command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
  register: flannel
  changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

- name: Wait for nodes to be ready
  command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

- name: Taint master node to allow pods
  command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  register: taint
  failed_when: false